<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .child{
             background: aliceblue;
             border: 2px solid green;
             padding: 14px;
             margin: 14px;
             cursor: pointer;
        }
        .childcontainer{
            background-color: aqua;
             padding: 14px;
             margin: 14px;
        }
        .container{
             background-color: rgb(218, 244, 20);
             padding: 14px;
             margin: 14px;

        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childcontainer">
            <div class="child">
                 I am a child
            </div>
        </section>

    </div>
      <script>
        document.querySelector(".child").addEventListener("contextmenu",(e)=>{
            e.stopPropagation()
            alert("Child was killed")
        })
        document.querySelector(".childcontainer").addEventListener("contextmenu",(e)=>{
            e.stopPropagation()
            alert("Child container was killed")
        })
         document.querySelector(".container").addEventListener("contextmenu",(e)=>{
            alert("container was killed")
        })

    </script>
</body>
</html>
