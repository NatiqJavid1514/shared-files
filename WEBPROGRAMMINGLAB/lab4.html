<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-FLEXBOX</title>
    <style>
        .container {
  display: flex;
  background-color: rgb(91, 116, 141);
  flex-wrap: wrap;
  
}

.container div {
  background-color: #f1f1f1;
  margin: 10px;
  padding: 20px;
  font-size: 30px;
  
  
}
.para{
    background-color: aqua;
    border: 2px solid blue;
}
.grid{
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;

}

.items{
  border: 2px solid green;
  width: 100px;
  height: 100px;
  background-color: blue;



}

        
        
        
    </style>


</head>
<body>
        <script>
        alert("today is a holiday")

    </script>
    
    <div class="container">
  <div>Item 1</div>
  <div>Item 2</div>
  <div>Item 3</div>
  <div>Item 4</div>
  <div>Item 5</div>
</div>
<div class="grid">
    <div class="items item1">Item 1</div>
    <div class="items item2">Item 2</div>
    <div class="items item3">Item 3</div>

</div>
<div class="para">
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis facere voluptas exercitationem nobis ducimus assumenda, praesentium facilis recusandae libero quam quod sint ratione.
   </div>



</body>
</html>
