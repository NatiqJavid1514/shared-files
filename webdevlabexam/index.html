<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Spanning and Cellspacing</title>
</head>
<body>
    <table border="1" cellspacing="5" cellpadding="10">
        <tr>
            <th colspan="2">Header 1</th>
        </tr>
        <tr>
            <td rowspan="2">Header 2</td>
            <td>Data 1</td>
        </tr>
        <tr>
            <td>Data 2</td>
        </tr>
        <tr>
            <td>Data 3</td>
        </tr>
    </table>
</body>
</html>
